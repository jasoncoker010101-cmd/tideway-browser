name: Build Tideway

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tideway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Enable the Electron test sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run test:desktop

  package:
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: macos-apple-silicon
          - runner: macos-15-intel
            target: macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Archive for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Tideway-win32-x64/* -DestinationPath dist/Tideway-windows-x64.zip
      - name: Archive for macOS and Linux
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: tar -czf "dist/Tideway-${TARGET}.tar.gz" -C dist Tideway-*/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tideway-${{ matrix.target }}
          path: |
            dist/Tideway-*.zip
            dist/Tideway-*.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
