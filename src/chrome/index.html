<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>Tideway</title>
  <link rel="stylesheet" href="style.css">
  <script src="ui.js" defer></script>
</head>
<body>
  <header id="chrome" aria-label="Browser controls">
    <div class="tabbar">
      <div id="tabs" role="group" aria-label="Open tabs"></div>
      <button class="icon tab-plus" data-action="newTab" data-icon="plus" aria-label="New tab"></button>
      <div class="window-label"><span id="window-name">TIDEWAY</span><span class="window-dot"></span></div>
    </div>
    <div class="toolbar">
      <div class="nav-buttons" role="group" aria-label="Page navigation">
        <button id="back" class="icon" data-action="back" data-icon="left" aria-label="Back" disabled></button>
        <button id="forward" class="icon" data-action="forward" data-icon="right" aria-label="Forward" disabled></button>
        <button id="reload" class="icon" data-action="reload" data-icon="reload" aria-label="Reload" disabled></button>
      </div>
      <form id="address-form" class="address-frame" role="search" aria-label="Address and search">
        <span class="address-symbol" id="address-symbol" aria-hidden="true" data-icon="globe"></span>
        <span class="insecure" id="insecure" hidden>Not secure</span>
        <input id="address" type="text" aria-label="Address and search bar" placeholder="Search or enter an address" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="4096">
        <button class="icon" id="bookmark" type="button" data-action="bookmark" data-icon="star" aria-label="Bookmark this page" aria-pressed="false" disabled></button>
      </form>
      <div class="tools" role="group" aria-label="Browser tools">
        <button class="icon tool-library" data-action="bookmarks" data-icon="bookmarks" aria-label="Bookmarks" aria-pressed="false"></button>
        <button class="icon" data-action="downloads" data-icon="download" aria-label="Downloads" aria-pressed="false"></button>
        <button class="icon" data-action="menu" data-icon="menu" aria-label="Browser menu" aria-pressed="false"></button>
      </div>
    </div>
  </header>
  <div id="find-bar" class="findbar" hidden>
    <input id="find" type="search" aria-label="Find text on this page" placeholder="Find on page" spellcheck="false" maxlength="512">
    <span id="matches" aria-live="polite"></span>
    <button class="icon" data-action="findPrevious" data-icon="up" aria-label="Previous match"></button>
    <button class="icon" data-action="findNext" data-icon="down" aria-label="Next match"></button>
    <button class="icon" data-action="dismiss" data-icon="close" aria-label="Close find bar"></button>
  </div>
  <main>
    <section class="start" id="start" aria-labelledby="start-title">
      <div class="start-wrap">
        <div class="start-hero">
          <div class="hero-lines" aria-hidden="true">
            <svg viewBox="0 0 440 380" fill="none" preserveAspectRatio="xMidYMid slice">
              <circle cx="381" cy="175" r="78"/><circle cx="381" cy="175" r="102"/><circle cx="381" cy="175" r="126"/>
              <circle cx="381" cy="175" r="150"/><circle cx="381" cy="175" r="174"/><circle cx="381" cy="175" r="198"/>
              <circle cx="381" cy="175" r="222"/><circle cx="381" cy="175" r="246"/><circle cx="381" cy="175" r="270"/>
              <path d="M70 175h390M381 0v380" class="hero-axis"/><circle cx="381" cy="175" r="5" class="hero-center"/>
              <circle cx="255" cy="175" r="4" class="hero-point"/>
            </svg>
          </div>
          <div class="hero-content">
            <p class="eyebrow"><span class="signal"></span><span id="start-mode">NEW TAB</span></p>
            <h1 id="start-title">Start exploring.</h1>
            <p class="hero-description" id="start-description">Enter a website or search the web.</p>
            <form id="start-form" class="start-form" role="search">
              <span aria-hidden="true" data-icon="search"></span>
              <input id="start-search" type="text" aria-label="Search the web or enter a URL" placeholder="Search the web or enter a URL" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="4096">
              <button class="icon go" type="submit" data-icon="right" aria-label="Go"></button>
            </form>
            <p class="provider" id="provider"></p>
          </div>
        </div>
        <section id="recent" class="recent" aria-labelledby="recent-title">
          <div class="section-heading">
            <div><p class="eyebrow">PICK UP WHERE YOU LEFT OFF</p><h2 id="recent-title">Recently visited</h2></div>
            <button class="quiet" data-action="history">View history <span aria-hidden="true" data-icon="arrowup"></span></button>
          </div>
          <div id="recent-list" class="recent-list"></div>
        </section>
        <div class="start-footer"><span>TIDEWAY BROWSER</span><span class="shortcut"><kbd id="shortcut-prefix">Ctrl</kbd><kbd>L</kbd> Address bar</span></div>
      </div>
    </section>
    <section id="loading-page" class="utility" hidden>
      <div class="utility-wrap">
        <p class="eyebrow"><span class="signal"></span> LOADING PAGE</p>
        <h1 id="loading-host"></h1>
      </div>
    </section>
    <section id="error-page" class="utility" hidden>
      <div class="utility-wrap">
        <p class="eyebrow"><span class="signal"></span> PAGE UNAVAILABLE</p>
        <h1>Couldn’t load this page.</h1>
        <p id="error-url" class="wrap"></p>
        <p class="muted" id="error-detail"></p>
        <button class="primary" data-action="retry">Try again</button>
      </div>
    </section>
    <section id="panel" class="utility" aria-labelledby="panel-title" hidden>
      <div class="utility-wrap">
        <div class="section-heading panel-heading">
          <div><p class="eyebrow"><span class="signal"></span> <span id="panel-label">LIBRARY</span></p><h1 id="panel-title" tabindex="-1"></h1></div>
          <button class="icon" data-action="dismiss" data-icon="close" aria-label="Close panel"></button>
        </div>
        <p id="panel-description" class="muted"></p>
        <div id="panel-body"></div>
      </div>
    </section>
  </main>
  <div id="notice" role="status" hidden></div>
</body>
</html>
